<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>OBMC Enroll Now</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: url("obmc.jpg") no-repeat center center fixed;
      background-size: cover;
    }

    .form-card {
      background: rgba(255, 255, 255, 0.9);
      border-radius: 10px;
      max-width: 520px; 
      margin: auto;
    }

    .logo {
      width: 38px;
    }

    .navbar-brand {
      margin-left: 20px;
    }

    footer {
      font-size: 0.8rem;
    }
  </style>
</head>
<body>


<!-- ✅ NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
  <div class="container-fluid">

    <!-- LOGO + TITLE (LEFT, MOVED INWARD) -->
    <a class="navbar-brand d-flex align-items-center" href="#">
      <img src="logo.webp" class="logo me-2" alt="Logo">
      Enroll Now
    </a>

    <!-- TOGGLER -->
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- NAV CONTENT -->
    <div class="collapse navbar-collapse" id="navMenu">

      <!-- EMPTY LEFT SPACE -->
      <ul class="navbar-nav me-auto"></ul>

      <!-- SEARCH BAR (RIGHT) -->
      <form class="d-flex me-3" role="search">
        <input class="form-control form-control-sm me-2" type="search" placeholder="Search">
        <button class="btn btn-sm btn-primary" type="submit">Search</button>
      </form>

    </div>
  </div>
</nav>

<!-- ✅ MAIN CONTENT -->
<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-lg-6 col-md-8">

      <!-- FORM CARD -->
      <div class="form-card shadow p-4">

        <div class="text-center mb-3">
          <img src="logo.webp" alt="OBMC Logo" width="60" class="mb-2">
          <h1>OBMC Student Enrollment Form</h1>
          <p class="text-muted small">
            Fill out the form below to enroll for the upcoming school year.
          </p>
        </div>

        <form>

          <!-- Student Info -->
          <h2 class="h5 mt-3">Student Information</h2>

          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control">
            </div>
          </div>

          <div class="row">
            <div class="col-md-4 mb-3">
              <label class="form-label">Birth Date</label>
              <input type="date" class="form-control">
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Gender</label>
              <select class="form-control">
                <option>Select...</option>
              </select>
            </div>
            <div class="col-md-4 mb-3">
              <label class="form-label">Grade Level</label>
              <select class="form-control">
                <option>Select...</option>
              </select>
            </div>
          </div>

          <!-- Contact -->
          <h2 class="h5 mt-3">Contact Details</h2>

          <div class="mb-3">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control">
          </div>

          <div class="mb-3">
            <label class="form-label">Contact Number</label>
            <input type="text" class="form-control">
          </div>

          <!-- Other Info -->
          <h2 class="h5 mt-3">Other Information</h2>

          <div class="form-check">
            <input class="form-check-input" type="radio" name="mode">
            <label class="form-check-label">Online</label>
          </div>
          <div class="form-check mb-2">
            <input class="form-check-input" type="radio" name="mode">
            <label class="form-check-label">Face-to-Face</label>
          </div>

          <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label small">
              I confirm that the information provided is true and complete.
            </label>
          </div>

          <div class="text-center">
            <button class="btn btn-primary w-100">
              Submit Enrollment
            </button>
          </div>

      
        </form>
      </div>
    </div>
  </div>

<!-- FOOTER -->
<footer class="bg-dark text-light text-center py-2 mt-5">
  © 2025 Student Enrollment System
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
